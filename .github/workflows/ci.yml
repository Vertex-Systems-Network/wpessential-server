name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: wpes-server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          extensions: zip
          tools: composer:v2
          coverage: none

      - name: Install dev tools
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Unit tests
        run: vendor/bin/phpunit

      - name: Coding standards (src)
        if: matrix.php == '8.2'
        run: vendor/bin/phpcs -q --standard=phpcs.xml.dist src --report=summary || echo "::warning::PHPCS findings above (non-blocking)."

      - name: Build the plugin ZIP
        run: php tools/build-zip.php
