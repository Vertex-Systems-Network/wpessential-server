name: Build ZIP

# Run it from Actions → Build ZIP → Run workflow; the ZIP is attached to the run as an
# artifact. Pushing a tag like v1.2.0 also builds it and attaches it to a GitHub release.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: wpessential-server.zip
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.2'
          extensions: zip
          coverage: none

      - name: Build
        id: build
        shell: bash
        run: |
          set -euo pipefail
          php tools/build-zip.php
          version="$(sed -n 's/^ \* Version:[[:space:]]*//p' wpessential-server.php | head -1)"
          echo "version=${version:-dev}" >> "$GITHUB_OUTPUT"
          sha256sum artifacts/wpessential-server.zip | tee artifacts/wpessential-server.zip.sha256

      # The artifact holds the wpessential-server/ folder itself (no zip inside a zip): unzip the download
      # and copy the folder to wp-content, or zip that folder to upload it in WordPress.
      - name: Unpack into the artifact folder
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifact-root && mkdir artifact-root
          unzip -q artifacts/wpessential-server.zip -d artifact-root
          test -d artifact-root/wpessential-server
          test "$(ls -A artifact-root)" = "wpessential-server"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wpessential-server-${{ steps.build.outputs.version }}-${{ github.run_number }}
          path: artifact-root/
          if-no-files-found: error
          retention-days: 30

      - name: Attach to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "WPE Server $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" artifacts/wpessential-server.zip artifacts/wpessential-server.zip.sha256 --clobber --repo "$GITHUB_REPOSITORY"
